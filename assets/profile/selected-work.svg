<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Selected experiments</title>
  <desc id="desc">Original editorial artwork for Rudransh Singh's GitHub profile. Project diagrams are conceptual studies, not application screenshots.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.serif{font-family:Georgia,serif;font-style:italic}.trace{stroke-dasharray:16 24;animation:flow 8s linear infinite}.drift{animation:drift 7s ease-in-out infinite}.scan{animation:scan 9s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes drift{50%{transform:translateY(-10px)}}@keyframes scan{50%{transform:translateX(90px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect width="1200" height="260" fill="#0B0A11" />
  <text x="48" y="52" font-size="25" fill="#F44984">01   SELECTED EXPERIMENTS</text>
  <text x="45" y="145" font-size="91" fill="#F5F0ED">Curiosity,</text>
  <text x="510" y="145" font-size="84" fill="#FF865A" class="serif">made tangible.</text>
  <text x="50" y="210" font-size="25" fill="#BEB4CB">Intelligent systems. Real interfaces. Five things I had to try.</text>
