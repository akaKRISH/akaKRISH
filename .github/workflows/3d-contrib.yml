name: 3D Contributions

on:
  schedule:
    - cron: "31 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D contribution assets
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Move generated assets
        run: |
          mkdir -p assets/3d
          cp profile-3d-contrib/profile-night-green.svg assets/3d/profile-night-green.svg
          cp profile-3d-contrib/profile-green.svg assets/3d/profile-green.svg
          cp profile-3d-contrib/profile-green-animate.svg assets/3d/profile-green-animate.svg
          rm -rf profile-3d-contrib

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d
          git diff --cached --quiet || git commit -m "chore: update 3D contribution visualization"
          git push
