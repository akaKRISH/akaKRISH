name: Validate profile README assets

on:
  pull_request:
    paths:
      - README.md
      - assets/**
      - character/ruru.svg
      - scripts/validate_profile.py
      - scripts/generate_activity.py
      - scripts/test_activity.py
      - .github/workflows/profile-assets.yml
      - .github/workflows/snake.yml
  push:
    branches: [main]
    paths:
      - README.md
      - assets/profile/**
      - scripts/validate_profile.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install asset validation dependency
        run: python -m pip install Pillow==12.3.0
      - name: Validate README and local graphics
        run: python scripts/validate_profile.py
      - name: Test activity rendering
        run: python -m unittest discover -s scripts -p "test_activity.py"
