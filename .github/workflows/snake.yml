name: Contribution Snake

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake/github-contribution-grid-snake.svg?color_snake=%2378c4ff&color_dots=%23161b22%2C%231d4ed8%2C%234f46e5%2C%237c3aed%2C%23a78bfa
            assets/snake/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2378c4ff

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake
          git diff --cached --quiet || git commit -m "chore: update contribution snake"
          git push
