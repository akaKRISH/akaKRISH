<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RURU — Interactive Contributions</title>
<style>
:root{color-scheme:dark;--bg:#05070b;--panel:#0b1220;--line:#1d2a40;--blue:#69b7ff;--violet:#a08cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#13213b 0,#05070b 55%);font-family:Inter,system-ui,sans-serif;color:#e8eef7;min-height:100vh;display:grid;place-items:center}
main{width:min(1100px,94vw)}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{font:14px monospace;color:var(--blue)}h1{font-size:clamp(32px,6vw,64px);margin:8px 0}.muted{color:#8493a8}
.scene{height:min(68vh,650px);perspective:1400px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#09101caa,#05070bcc);cursor:grab}
.scene:active{cursor:grabbing}.card{width:min(880px,86vw);transform-style:preserve-3d;transition:transform .08s linear;filter:drop-shadow(0 35px 60px #000b)}.card img{display:block;width:100%;border-radius:18px;transform:translateZ(25px)}.glow{position:absolute;inset:12%;background:radial-gradient(circle,#3b82f633,transparent 62%);filter:blur(30px);transform:translateZ(-80px)}
.controls{margin-top:18px;display:flex;gap:14px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#0b1220;padding:9px 13px;border-radius:999px;color:#9aa8bb;font:13px monospace}
</style>
</head>
<body>
<main>
<div class="top"><div><div class="eyebrow">RURU // CONTRIBUTION LAB</div><h1>3D Contribution Field</h1><div class="muted">Drag to rotate · move to tilt · scroll to zoom</div></div></div>
<div class="scene" id="scene"><div class="glow"></div><div class="card" id="card"><img src="../assets/3d/profile-night-green.svg" alt="3D GitHub contribution visualization"></div></div>
<div class="controls"><span class="pill">LIVE GITHUB ASSET</span><span class="pill">INTERACTIVE VIEWER</span><span class="pill">ESC RESET</span></div>
</main>
<script>
const s=document.getElementById('scene'),c=document.getElementById('card');
let rx=-8,ry=0,scale=1,down=false,lastX=0,lastY=0;
function render(){c.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) scale(${scale})`}
s.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;s.setPointerCapture(e.pointerId)});
s.addEventListener('pointermove',e=>{if(!down)return;ry+=(e.clientX-lastX)*.35;rx-=(e.clientY-lastY)*.25;rx=Math.max(-55,Math.min(55,rx));lastX=e.clientX;lastY=e.clientY;render()});
s.addEventListener('pointerup',()=>down=false);
s.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.65,Math.min(1.35,scale-e.deltaY*.0008));render()},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){rx=-8;ry=0;scale=1;render()}});
render();
</script>
</body>
</html>
